# Tests on every push and pull request (Windows and macOS); on a version tag
# (v1.2.3) also builds Lazyfold.exe, packs Lazyfold-Setup-<version>.exe and
# publishes a GitHub Release, then adds Lazyfold-<version>-mac.dmg (Apple
# Silicon) and the Full editions of both to it.
name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Lazyfold with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[content,dev]"
      - name: Run tests
        shell: pwsh
        env:
          LAZYFOLD_CI: "1"
        run: |
          python -m pytest -q -rfE 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          # Show each failure as an annotation on the run page.
          Select-String -Path pytest-output.txt -Pattern '^(FAILED|ERROR) ' | ForEach-Object { Write-Output "::error title=pytest::$($_.Line)" }
          exit $code

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # to attach the installer to a Release on tags
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Install build tools (no PyTorch, the app does not bundle it)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pywebview>=6.2" "pyinstaller>=6.22" "pypdf>=6.21.2" "pillow>=12"
      - name: Build Lazyfold.exe and LazyfoldCLI.exe
        run: pyinstaller packaging\lazyfold.spec --noconfirm --distpath packaging\output\dist --workpath packaging\output\build
      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $exe = "packaging\output\dist\Lazyfold\LazyfoldCLI.exe"
          $env:LAZYFOLD_HOME = Join-Path $env:RUNNER_TEMP "lf-home"
          & $exe --version
          $d = Join-Path $env:RUNNER_TEMP "demo\Downloads"
          & $exe demo $d
          & $exe plan $d
          if ($LASTEXITCODE -ne 0) { throw "plan failed" }
          python packaging\check_renames.py
          if ($LASTEXITCODE -ne 0) { throw "the CLI suggested no names" }
          # The window program reads documents the same way when the app is open.
          $p = Start-Process -FilePath "packaging\output\dist\Lazyfold\Lazyfold.exe" -ArgumentList @("plan", $d) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "plan through Lazyfold.exe failed" }
          python packaging\check_renames.py
          if ($LASTEXITCODE -ne 0) { throw "the window program suggested no names" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The app's own version (lazyfold/__init__.py) is the source of truth.
          $appVersion = python -c "import lazyfold; print(lazyfold.__version__)"
          $version = $appVersion
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:REF_NAME' is not like v1.2.3 or v1.2.3-rc1" }
            if ($Matches[1] -ne $appVersion) { throw "Tag $env:REF_NAME does not match lazyfold.__version__ $appVersion" }
            $version = $env:REF_NAME.Substring(1)
          }
          $numeric = ($version -split '-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DAppVersionNum=$numeric" packaging\lazyfold.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem packaging\output\*.exe
      - uses: actions/upload-artifact@v5
        with:
          name: Lazyfold-Setup
          path: packaging/output/Lazyfold-Setup-*.exe
          if-no-files-found: error
      - name: "Publish release (tags only)"
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output/Lazyfold-Setup-*.exe
          generate_release_notes: true

  # "Full" edition: the same app plus CPU PyTorch, TabPFN and the TabPFN v2
  # weights, so the approval predictor works offline right after install.
  # Runs after `build` so on tags the lean job creates the Release first and
  # this one only adds a file to it (two jobs creating it at once can race).
  build-full:
    needs: [test, build]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # to attach the installer to a Release on tags
    env:
      CKPT_NAME: tabpfn-v2-classifier-finetuned-zk73skhh.ckpt
      CKPT_SHA256: cf8c519c01eaf1613ee91239006d57b1c806ff5f23ac1aeb1315ba1015210e49
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # 3.12.0 breaks frozen scipy; setup-python gives the latest 3.12.x
      - name: "Install build tools with CPU PyTorch and TabPFN"
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tabpfn==9.2.0 "pywebview>=6.2" "pyinstaller>=6.22" "pypdf>=6.21.2" "pillow>=12"
      - name: Cache the TabPFN v2 checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tabpfn
          key: tabpfn-${{ env.CKPT_NAME }}
      - name: Download the TabPFN v2 checkpoint from Hugging Face
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "tabpfn"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $ckpt = Join-Path $dir $env:CKPT_NAME
          if (-not (Test-Path $ckpt)) {
            curl.exe -fsSL --retry 3 --connect-timeout 30 --max-time 900 -o $ckpt "https://huggingface.co/Prior-Labs/TabPFN-v2-clf/resolve/main/$env:CKPT_NAME"
            if ($LASTEXITCODE -ne 0) { throw "checkpoint download failed" }
          }
          $hash = (Get-FileHash $ckpt -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CKPT_SHA256) { Remove-Item $ckpt; throw "checkpoint SHA-256 $hash does not match $env:CKPT_SHA256" }
          "LAZYFOLD_TABPFN_CKPT=$ckpt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the Full Lazyfold.exe and LazyfoldCLI.exe
        run: pyinstaller packaging\lazyfold-full.spec --noconfirm --distpath packaging\output-full\dist --workpath packaging\output-full\build
      - name: Smoke-test the Full exe (offline TabPFN prediction)
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          $exe = "packaging\output-full\dist\Lazyfold\LazyfoldCLI.exe"
          $env:LAZYFOLD_HOME = Join-Path $env:RUNNER_TEMP "sf-home"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "empty-appdata"   # prove the bundled weights are used
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          & $exe --version
          & $exe predictor selftest
          if ($LASTEXITCODE -ne 0) { throw "predictor selftest failed" }
          $d = Join-Path $env:RUNNER_TEMP "demo\Downloads"
          & $exe demo $d
          & $exe plan $d
          if ($LASTEXITCODE -ne 0) { throw "plan failed" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the Full installer
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Same version rules as the lean build job.
          $appVersion = python -c "import lazyfold; print(lazyfold.__version__)"
          $version = $appVersion
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:REF_NAME' is not like v1.2.3 or v1.2.3-rc1" }
            if ($Matches[1] -ne $appVersion) { throw "Tag $env:REF_NAME does not match lazyfold.__version__ $appVersion" }
            $version = $env:REF_NAME.Substring(1)
          }
          $numeric = ($version -split '-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DAppVersionNum=$numeric" packaging\lazyfold-full.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem packaging\output-full\*.exe
      - uses: actions/upload-artifact@v5
        with:
          name: Lazyfold-Setup-Full
          path: packaging/output-full/Lazyfold-Setup-Full-*.exe
          if-no-files-found: error
      - name: "Attach the Full installer to the release (tags only)"
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output-full/Lazyfold-Setup-Full-*.exe

  # macOS (Apple Silicon): the same tests on a Mac, then Lazyfold.app in a .dmg.
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Lazyfold with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[content,dev]"
      - name: Run tests
        shell: bash
        env:
          LAZYFOLD_CI: "1"
        run: |
          set +e
          python -m pytest -q -rfE 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          # Show each failure as an annotation on the run page.
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while IFS= read -r line; do echo "::error title=pytest::$line"; done
          exit $code

  # Runs after `build` so on tags the Windows job has already created the
  # Release; this one only adds the .dmg to it.
  build-macos:
    needs: [test, test-macos, build]
    runs-on: macos-14
    permissions:
      contents: write   # to attach the .dmg to a Release on tags
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Same version rules as the Windows build jobs.
          app_version=$(python -c "import lazyfold; print(lazyfold.__version__)")
          version=$app_version
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$REF_NAME' is not like v1.2.3 or v1.2.3-rc1"; exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$app_version" ]; then
              echo "::error::Tag $REF_NAME does not match lazyfold.__version__ $app_version"; exit 1
            fi
            version=${REF_NAME#v}
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: "Install build tools (no PyTorch, the app does not bundle it)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pywebview>=6.2" "pyinstaller>=6.22" "pypdf>=6.21.2" "pillow>=12" "pyobjc-framework-Cocoa>=10" "pyobjc-framework-Vision>=10"
      - name: Write the third-party notices for the Mac build
        run: python packaging/make_notices.py lean
      - name: Build Lazyfold.app
        run: pyinstaller packaging/lazyfold-mac.spec --noconfirm --distpath packaging/output/dist --workpath packaging/output/build
      - name: Smoke-test the built app
        shell: bash
        run: |
          app=packaging/output/dist/Lazyfold.app
          plutil -p "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/Lazyfold" || { echo "::error::Lazyfold is missing from Contents/MacOS"; exit 1; }
          main=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          [ "$main" = "Lazyfold" ] || { echo "::error::CFBundleExecutable is $main, not Lazyfold"; exit 1; }
          exe="$app/Contents/MacOS/LazyfoldCLI"
          export LAZYFOLD_HOME="$RUNNER_TEMP/sf-home"
          "$exe" --version
          d="$RUNNER_TEMP/demo/Downloads"
          "$exe" demo "$d"
          "$exe" plan "$d" || { echo "::error::plan failed"; exit 1; }
          python packaging/check_renames.py
          # The window program (what runs when the app is open) must read documents too.
          "$app/Contents/MacOS/Lazyfold" plan "$d" || { echo "::error::plan through the app failed"; exit 1; }
          python packaging/check_renames.py
      - name: Make the .dmg
        shell: bash
        run: |
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto packaging/output/dist/Lazyfold.app "$stage/Lazyfold.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Lazyfold -srcfolder "$stage" -ov -format UDZO "packaging/output/Lazyfold-$VERSION-mac.dmg"
          ls -l packaging/output/*.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: Lazyfold-mac
          path: packaging/output/Lazyfold-*-mac.dmg
          if-no-files-found: error
      - name: "Attach the .dmg to the release (tags only)"
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output/Lazyfold-*-mac.dmg

  # "Full" Mac edition: the app plus PyTorch, TabPFN and the TabPFN v2 weights.
  build-macos-full:
    needs: build-macos
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write   # to attach the .dmg to a Release on tags
    env:
      CKPT_NAME: tabpfn-v2-classifier-finetuned-zk73skhh.ckpt
      CKPT_SHA256: cf8c519c01eaf1613ee91239006d57b1c806ff5f23ac1aeb1315ba1015210e49
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # 3.12.0 breaks frozen scipy; setup-python gives the latest 3.12.x
      - name: Check the version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Same version rules as the Windows build jobs.
          app_version=$(python -c "import lazyfold; print(lazyfold.__version__)")
          version=$app_version
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$REF_NAME' is not like v1.2.3 or v1.2.3-rc1"; exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$app_version" ]; then
              echo "::error::Tag $REF_NAME does not match lazyfold.__version__ $app_version"; exit 1
            fi
            version=${REF_NAME#v}
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: "Install build tools with PyTorch and TabPFN"
        run: |
          python -m pip install --upgrade pip
          # The PyPI torch wheel for macOS arm64 is the CPU/MPS build (no CUDA).
          python -m pip install torch
          python -m pip install tabpfn==9.2.0 "pywebview>=6.2" "pyinstaller>=6.22" "pypdf>=6.21.2" "pillow>=12" "pyobjc-framework-Cocoa>=10" "pyobjc-framework-Vision>=10"
      - name: Cache the TabPFN v2 checkpoint
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tabpfn
          key: tabpfn-${{ env.CKPT_NAME }}
      - name: Download the TabPFN v2 checkpoint from Hugging Face
        shell: bash
        run: |
          dir="$RUNNER_TEMP/tabpfn"
          mkdir -p "$dir"
          ckpt="$dir/$CKPT_NAME"
          if [ ! -f "$ckpt" ]; then
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 900 -o "$ckpt" "https://huggingface.co/Prior-Labs/TabPFN-v2-clf/resolve/main/$CKPT_NAME" \
              || { rm -f "$ckpt"; echo "::error::checkpoint download failed"; exit 1; }
          fi
          hash=$(shasum -a 256 "$ckpt" | cut -d' ' -f1)
          if [ "$hash" != "$CKPT_SHA256" ]; then
            rm -f "$ckpt"; echo "::error::checkpoint SHA-256 $hash does not match $CKPT_SHA256"; exit 1
          fi
          echo "LAZYFOLD_TABPFN_CKPT=$ckpt" >> "$GITHUB_ENV"
      - name: Write the third-party notices for the Mac Full build
        run: python packaging/make_notices.py full
      - name: Build the Full Lazyfold.app
        run: pyinstaller packaging/lazyfold-mac-full.spec --noconfirm --distpath packaging/output-full/dist --workpath packaging/output-full/build
      - name: Smoke-test the Full app (offline TabPFN prediction)
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          app=packaging/output-full/dist/Lazyfold.app
          exe="$PWD/$app/Contents/MacOS/LazyfoldCLI"
          # Where sys._MEIPASS points in an .app (data is symlinked here from Contents/Resources).
          ls -lL "$app/Contents/Frameworks/tabpfn_models/"
          export LAZYFOLD_HOME="$RUNNER_TEMP/sf-home"
          # An empty home with no tabpfn or Hugging Face cache: proves the bundled weights are used.
          export HOME="$RUNNER_TEMP/empty-home"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME"
          "$exe" --version
          "$exe" predictor selftest || { echo "::error::predictor selftest failed"; exit 1; }
          d="$RUNNER_TEMP/demo/Downloads"
          "$exe" demo "$d"
          "$exe" plan "$d" || { echo "::error::plan failed"; exit 1; }
      - name: Make the Full .dmg
        shell: bash
        run: |
          stage="$RUNNER_TEMP/dmg-full"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto packaging/output-full/dist/Lazyfold.app "$stage/Lazyfold.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Lazyfold -srcfolder "$stage" -ov -format UDZO "packaging/output-full/Lazyfold-Full-$VERSION-mac.dmg"
          ls -l packaging/output-full/*.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: Lazyfold-mac-Full
          path: packaging/output-full/Lazyfold-Full-*-mac.dmg
          if-no-files-found: error
      - name: "Attach the Full .dmg to the release (tags only)"
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/output-full/Lazyfold-Full-*-mac.dmg
