[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothfile"
version = "0.3.0"
description = "Local-first, preview-first, undoable Downloads organizer with optional on-device Gemma"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Text from PDFs and image metadata. Without them SlothFile still works on
# file types and names; PDF content is simply not read.
content = ["pypdf>=6.21.2", "pillow>=12"]
desktop = ["pywebview>=6.2"]
dev = ["pytest>=9"]
# Approval predictor (TabPFN, Prior Labs License). Install CPU torch first so
# pip does not pull the multi-GB CUDA build:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
predict = ["tabpfn>=9.2"]

[project.scripts]
slothfile = "slothfile.cli:main"

[project.gui-scripts]
slothfile-desktop = "slothfile.desktop:main"

[tool.setuptools]
packages = ["slothfile"]

[tool.setuptools.package-data]
slothfile = ["ui.html", "ocr.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
