[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyfold"
version = "0.6.0"
description = "Local-first, preview-first, undoable Downloads organizer with optional on-device Gemma"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Text from PDFs and image metadata. Without them Lazyfold still works on
# file types and names; PDF content is simply not read.
# On a Mac, text in images is read with Apple's Vision framework (the
# pyobjc bindings also bring Foundation, used to move files to the Trash).
content = ["pypdf>=6.21.2", "pillow>=12", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'", "pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]
# On a Mac, pywebview pulls in the pyobjc Cocoa/WebKit bindings it needs.
desktop = ["pywebview>=6.2"]
dev = ["pytest>=9"]
# Approval predictor (TabPFN, Prior Labs License). Install CPU torch first so
# pip does not pull the multi-GB CUDA build:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
predict = ["tabpfn>=9.2"]

[project.scripts]
lazyfold = "lazyfold.cli:main"

[project.gui-scripts]
lazyfold-desktop = "lazyfold.desktop:main"

[tool.setuptools]
packages = ["lazyfold"]

[tool.setuptools.package-data]
lazyfold = ["ui.html", "ocr.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
